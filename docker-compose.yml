# docker compose up -d     then open http://localhost:4747
#
# Server only: boards live in the named volume and are managed in the web UI.
# To share boards with the waypoint command line, use docker-compose.cli.yml.
services:
  waypoint:
    image: farinloyejonathan/waypoint
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4747:4747" # only this computer can reach it
    volumes:
      - waypoint-data:/home/waypoint

volumes:
  waypoint-data:
