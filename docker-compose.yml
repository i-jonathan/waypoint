# docker compose up -d     then open http://localhost:4747
#
# Your boards and config are mounted at the SAME paths as on your computer,
# because the registry stores absolute paths. HOME is passed through so the
# container finds them where `waypoint` on the host does.
services:
  waypoint:
    build: .
    image: waypoint
    restart: unless-stopped
    environment:
      HOME: ${HOME}
    ports:
      - "127.0.0.1:4747:4747" # only this computer can reach it
    volumes:
      - ${HOME}/.config/waypoint:${HOME}/.config/waypoint
      - ${HOME}/.local/share/waypoint:${HOME}/.local/share/waypoint
